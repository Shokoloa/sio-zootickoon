<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signaler un incident - Parc animalier de Val-Sorin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="charte.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Val-Sorin</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Accueil</a></li>
          <li class="nav-item"><a class="nav-link" href="secteurs.html">Secteurs</a></li>
          <li class="nav-item"><a class="nav-link active" href="ticket.html">Signaler un incident</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <h1>Signaler un incident</h1>
    <form action="traiter_ticket.php" method="post" class="col-md-6">
      <fieldset>
        <legend>Déclaration d'incident</legend>

        <div class="mb-3">
          <label class="form-label" for="secteur">Secteur concerné</label>
          <select class="form-select" id="secteur" name="secteur" required>
            <option value="SAV">Savane</option>
            <option value="TRO">Forêt tropicale</option>
            <option value="BAN">Banquise</option>
            <option value="FER">Ferme pédagogique</option>
            <option value="VOL">Grande volière</option>
            <option value="AQU">Aquarium</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label" for="sujet">Sujet</label>
          <input class="form-control" id="sujet" name="sujet" type="text" maxlength="120" required>
        </div>

        <div class="mb-3">
          <label class="form-label" for="description">Description</label>
          <textarea class="form-control" id="description" name="description" required></textarea>
        </div>

        <div class="mb-3">
          <p class="form-label mb-1">Priorité</p>
          <div class="form-check">
            <input class="form-check-input" type="radio" id="p1" name="priorite" value="basse" checked>
            <label class="form-check-label" for="p1">Basse</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" id="p2" name="priorite" value="moyenne">
            <label class="form-check-label" for="p2">Moyenne</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" id="p3" name="priorite" value="haute">
            <label class="form-check-label" for="p3">Haute</label>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="mel">Votre adresse électronique</label>
          <input class="form-control" id="mel" name="mel" type="email" required>
        </div>

        <button class="btn btn-primary" type="submit">Envoyer la déclaration</button>
      </fieldset>
    </form>
  </main>

  <footer class="text-center py-3">
    <p>Parc animalier de Val-Sorin — route des Étangs, Val-Sorin</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
